[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-factory"
version = "0.1.0"
description = "Multi-Agent Tool-Use Conversation Generator"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "networkx>=3.2",
    "click>=8.1",
    "pydantic>=2.5",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[project.scripts]
convfactory = "conversation_factory.cli:cli"

[tool.setuptools.packages.find]
include = ["conversation_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
